# epic の最終 PR（epic-final）が develop にマージされたら、ゴール元の Discussion を解決済みで閉じる。
# 処理の本体は ralph-kit の再利用できるワークフロー。このファイルは ralph-kit の install.sh が置く（直すときは ralph-kit を直す）
name: Close goal Discussion

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  discussions: write

jobs:
  close:
    uses: shilokuma-inc/ralph-kit/.github/workflows/close-goal-discussion.yml@v1

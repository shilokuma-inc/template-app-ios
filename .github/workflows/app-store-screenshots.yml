# app-kit が配るファイル（shilokuma-inc/app-kit の managed/）。直すときは app-kit で直す。このリポジトリで直すと、次に版を上げたときに上書きされる
# リポジトリごとの値は .github/app-kit.json に書く。版（@ の後ろのコミットと app-kit-ref）は AskHub の司令塔が書く
name: Screenshots/App Store

# App Store のスクショを撮る（上げない）。AskHub の司令塔が release ブランチで起動し、artifact screenshots-<表示サイズ> を取り込む。
# App Store Connect に上げるのは、人が AskHub で確かめた後の司令塔だけ。
# このファイルの名前と入力は、司令塔のビルドの設定（storeScreenshots の workflow）と合わせてある。変えるときは司令塔と一緒に変える
on:
  workflow_dispatch:
    inputs:
      display_types:
        description: '撮る表示サイズ（カンマ区切り）。空なら AppStore/screenshots.json のすべて'
        required: false
        default: ''
      languages:
        description: '撮る言語（カンマ区切り）。空なら AppStore/languages.json のすべて'
        required: false
        default: ''
      upload:
        description: '前の版との互換のためだけにある（上げるのは AskHub の司令塔なので、true なら止まる）'
        type: boolean
        default: false
      allow_non_release:
        description: 'release/** 以外のブランチでも撮る（撮影の仕組みを確かめるときだけ）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  screenshots:
    uses: shilokuma-inc/app-kit/.github/workflows/app-store-screenshots.yml@104f764424428402b72bf4c58ebbc8f2dd409e0c # v1.0.0
    with:
      # 引用符で囲む（数字と e だけのコミットを、YAML が数として読まないように）
      app-kit-ref: '104f764424428402b72bf4c58ebbc8f2dd409e0c'
      display_types: ${{ inputs.display_types }}
      languages: ${{ inputs.languages }}
      upload: ${{ inputs.upload }}
      allow_non_release: ${{ inputs.allow_non_release }}

name: Cleanup assets branch

# PR 本文がスクリーンショット置き場として参照している assets/issue-<番号> ブランチを、
# その PR のマージ時に削除する。PR の diff に画像を含めないための運用を後片付けまで自動化する。
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Cleanup
    # Fork からの PR では GITHUB_TOKEN が読み取り専用になり削除できない。assets/** は書き込み権限のある人しか
    # push できないので、Fork の PR が参照することも無い。同じリポジトリのブランチからの PR だけを対象にする
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete assets branches referenced by this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR 本文はスクリプトへ直接埋め込まず、環境変数経由で渡す
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # このリポジトリを指す URL（raw.githubusercontent.com/<repo>/assets/issue-N/... や
          # github.com/<repo>/blob/assets/issue-N/...）から、ブランチ名全体が規約に一致するものだけを拾う。
          # 他リポジトリの URL や assets/issue-12-backup のような別ブランチを誤って削除しないため
          repo_pattern=$(printf '%s' "$REPO" | sed 's/[.]/\\./g')
          branches=$(printf '%s' "$PR_BODY" \
            | grep -oE "/${repo_pattern}/((raw|blob|tree)/)?assets/issue-[0-9]+/" \
            | grep -oE 'assets/issue-[0-9]+' \
            | sort -u || true)
          if [ -z "$branches" ]; then
            echo "参照している assets ブランチはありません"
            exit 0
          fi

          # 削除するのは、この PR が解決する Issue（本文の「resolve #N」）のブランチだけにする。
          # 進行中の別の PR の画像を本文で参照していても、そのブランチは消さない。
          # epic/** 宛ての PR では GitHub の Issue の紐付け（closingIssuesReferences）が付かないため、本文から読む
          issues=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(resolve[sd]?|close[sd]?|fix(e[sd])?) +#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -u || true)

          for branch in $branches; do
            if ! printf '%s\n' "$issues" | grep -qx -- "${branch#assets/issue-}"; then
              echo "この PR が解決する Issue のブランチではないためスキップ: $branch"
              continue
            fi
            if gh api "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "削除しました: $branch"
            else
              echo "存在しないためスキップ: $branch"
            fi
          done

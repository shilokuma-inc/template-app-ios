name: Metadata/App Store

# App Store の掲載情報と、審査に出すのに要る App 情報などを App Store Connect に反映する。手動実行のみ。
#
#   Tools/upload_metadata.py … 名前・サブタイトル・説明文・キーワード・プロモーションテキスト・最新情報・URL・プライバシーポリシーの URL・著作権
#                              （元ネタは AppStore/metadata/<言語>.json と shared.json）
#   Tools/upload_app_info.py … カテゴリ・コンテンツの権利・年齢制限・App Review に関する情報・価格と配信状況
#                              （元ネタは AppStore/app_info.json。価格と配信状況は未設定のときだけ書き込む）
#
# App Review に関する情報の連絡先・デモアカウントは JSON に置かず、Secrets（APP_REVIEW_CONTACT_* / APP_REVIEW_DEMO_ACCOUNT_*）から渡す。
# Organization の Secrets に登録しておけば、テンプレートから作ったリポジトリすべてで使われる。未登録なら連絡先は書き込まない。
# App のプライバシー（収集するデータの申告）は API が無いので、App Store Connect の画面で入力する。
#
# 欠損と文字数超過は Verify/App Store metadata が PR の時点で落とすので、ここまで来たものは通る前提。
# 最新情報（whatsNew）は、JSON の whatsNew.version が反映先のバージョンと一致するときだけ書き込む。
# テンプレートの仮の文言（TODO:）が残っているあいだは、dry-run でも止まる。
#
# 反映先は「編集できる状態のバージョン」だけ。審査中・配信済みのバージョンには触らない。
# dry_run にすると、App Store Connect の現在値との差分だけを出して何も書き込まない。

on:
  workflow_dispatch:
    inputs:
      languages:
        description: '反映する言語（カンマ区切り）。空なら languages.json の全言語'
        required: false
        default: ''
      app_version:
        description: '反映先のバージョン。空なら編集できるバージョンを自動で選ぶ'
        required: false
        default: ''
      missing_locales:
        description: 'App Store Connect にその言語が無いときの扱い'
        type: choice
        options:
          - fail
          - skip
          - create
        default: fail
      dry_run:
        description: '書き込まず、現在値との差分だけ出す'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata:
    name: upload
    # App Store Connect にアプリが無いリポジトリ（テンプレート自身など）は ENABLE_DELIVERY=false でスキップする
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify metadata
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          python3 Tools/upload_metadata.py --check --languages "$LANGUAGES"
          python3 Tools/upload_app_info.py --check

      - name: Create Private Key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
          MISSING_LOCALES: ${{ inputs.missing_locales }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=(--missing-locales "$MISSING_LOCALES")
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # Bundle ID は Configs/Project.xcconfig から読む（ワークフローに書き写すと二重管理になるため）
          .venv/bin/python -u Tools/upload_metadata.py "${options[@]}" | tee "$RUNNER_TEMP/upload.log"

      - name: Upload app info to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          # 連絡先とデモアカウントは個人情報・秘密なので Secrets から渡す（スクリプトは値をログに出さない）
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_DEMO_ACCOUNT_NAME: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_NAME }}
          APP_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_PASSWORD }}
          APP_VERSION: ${{ inputs.app_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          options=()
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # venv は前のステップで作ったものを使う
          .venv/bin/python -u Tools/upload_app_info.py "${options[@]}" | tee "$RUNNER_TEMP/upload-app-info.log"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## App Store のメタデータ"
            echo
            echo "- 反映: $([ "$DRY_RUN" = "true" ] && echo "しない（dry-run）" || echo "する")"
            echo
            for log in upload upload-app-info; do
              if [ -f "$RUNNER_TEMP/$log.log" ]; then
                echo '```diff'
                cat "$RUNNER_TEMP/$log.log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

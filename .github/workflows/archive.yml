name: Archive

# main への push で Archive → IPA Export まで通ることを確認する（アップロードはしない）。
# develop / release/** は upload.yml が Archive を含むため、ここでは実行しない。
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: ./.github/workflows/_archive.yml
    with:
      upload: false
    secrets: inherit

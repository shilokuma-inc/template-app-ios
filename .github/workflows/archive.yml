# app-kit が配るファイル（shilokuma-inc/app-kit の managed/）。直すときは app-kit で直す。このリポジトリで直すと、次に版を上げたときに上書きされる
# リポジトリごとの値は .github/app-kit.json に書く。版（@ の後ろのコミットと app-kit-ref）は AskHub の司令塔が書く
name: Archive

# Archive → IPA の書き出しまで通るかを確かめる（上げない）。手動の実行だけ。
# develop・release/** は upload.yml が Archive を含む
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: shilokuma-inc/app-kit/.github/workflows/app-archive.yml@4ecdf346f1ff87c1a61172d2e0b25891e03aba63 # v1.0.1
    with:
      # 引用符で囲む（数字と e だけのコミットを、YAML が数として読まないように）
      app-kit-ref: '4ecdf346f1ff87c1a61172d2e0b25891e03aba63'
      upload: false
    secrets:
      EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      TESTFLIGHT_INTERNAL_TESTERS: ${{ secrets.TESTFLIGHT_INTERNAL_TESTERS }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

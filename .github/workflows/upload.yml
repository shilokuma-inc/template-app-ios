# app-kit が配るファイル（shilokuma-inc/app-kit の managed/）。直すときは app-kit で直す。このリポジトリで直すと、次に版を上げたときに上書きされる
# リポジトリごとの値は .github/app-kit.json に書く。版（@ の後ろのコミットと app-kit-ref）は AskHub の司令塔が書く
name: Upload

# develop・release/** への push で Archive → IPA の書き出し → App Store Connect への Upload を行う。
# 作業ブランチを TestFlight で確かめたいときは、手動の実行（workflow_dispatch）でそのブランチを選ぶ。
# 作業ブランチの push ごとに上げると、App Store Connect の 24 時間あたりのアップロードの上限に当たるため、自動では上げない。
# main には release ブランチの先頭がそのまま入るので、main では上げない
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# アップロードの途中で取り消すと、App Store Connect に中途半端なビルドが残るので、実行中のものは終わらせる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    # テンプレート自身など、App Store Connect にアプリが無いリポジトリでは、リポジトリの変数 ENABLE_DELIVERY=false で飛ばす
    if: vars.ENABLE_DELIVERY != 'false'
    uses: shilokuma-inc/app-kit/.github/workflows/app-archive.yml@104f764424428402b72bf4c58ebbc8f2dd409e0c # v1.0.0
    with:
      # 引用符で囲む（数字と e だけのコミットを、YAML が数として読まないように）
      app-kit-ref: '104f764424428402b72bf4c58ebbc8f2dd409e0c'
      upload: true
    # 組織をまたぐと secrets: inherit が効かないので、名前を並べて渡す
    secrets:
      EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      TESTFLIGHT_INTERNAL_TESTERS: ${{ secrets.TESTFLIGHT_INTERNAL_TESTERS }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

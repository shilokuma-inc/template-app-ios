# Archive → IPA Export（→ App Store Connect へアップロード）の共通処理。
# archive.yml / upload.yml から workflow_call で呼び出される。
#
# 認証はすべて App Store Connect API Key で行う（Apple ID / App 用パスワードは使わない）。
# アップロードは ExportOptions.plist の destination を upload にした xcodebuild -exportArchive で行う。
name: _archive

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.6'
      upload:
        description: Export した IPA を App Store Connect へアップロードするか
        type: boolean
        default: false
    secrets:
      EXPORT_OPTIONS:
        description: ExportOptions.plist の内容（destination と、アップロード時の manageAppVersionAndBuildNumber はワークフロー側で上書きする）
        required: true
      APPLE_API_KEY_BASE64:
        description: App Store Connect API Key（.p8）を base64 エンコードしたもの
        required: true
      APPLE_API_KEY_ID:
        description: App Store Connect API Key の Key ID
        required: true
      APPLE_API_ISSUER_ID:
        description: App Store Connect API Key の Issuer ID
        required: true
      TESTFLIGHT_INTERNAL_TESTERS:
        description: TestFlight の内部テスターにする人のメールアドレス（カンマ区切り。未登録なら内部テスターの設定を省く）
        required: false

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set up environment
        # プロジェクト名と同名の共有スキームが存在することを前提にする。
        # ExportOptions.plist と API 秘密鍵はリポジトリ配下ではなく RUNNER_TEMP に置く
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          {
            echo "PROJECT_NAME=$project"
            echo "SCHEME=$project"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "project=$project scheme=$project"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Fix signatures of stub frameworks
        # 静的な xcframework（Firebase・Google Mobile Ads など）は、同梱するときに Xcode がバイナリを外して空のスタブを差し込む（Injecting stub binary into codeless framework）。
        # スタブはリンカーの仮の署名のままで識別子が `arm64-apple` になっていて、署名なしの Archive では Xcode の署名で直らない。
        # Export はこの識別子のまま再署名するので、App Store Connect が Invalid Signature で弾く。
        # Info.plist の CFBundleIdentifier と識別子が違うフレームワークを、その識別子でアドホック署名し直しておく（本番の署名は Export がする）
        run: |
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$RUNNER_TEMP/build.xcarchive/Info.plist")
          frameworks="$RUNNER_TEMP/build.xcarchive/Products/$app_path/Frameworks"
          if [[ ! -d "$frameworks" ]]; then
            echo "同梱のフレームワークはありません"
            exit 0
          fi
          fixed=0
          for framework in "$frameworks"/*.framework; do
            [[ -e "$framework" ]] || continue
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$framework/Info.plist")
            identifier=$(codesign -dv "$framework" 2>&1 | sed -n 's/^Identifier=//p')
            if [[ "$identifier" != "$bundle_id" ]]; then
              codesign --force --sign - --identifier "$bundle_id" "$framework"
              echo "$(basename "$framework"): 署名の識別子を ${identifier:-（署名なし）} から $bundle_id に直しました"
              fixed=$((fixed + 1))
            fi
          done
          echo "署名の識別子を直したフレームワーク: ${fixed} 個"

      - name: Embed entitlements into the unsigned archive
        # 署名なし（CODE_SIGNING_ALLOWED=NO）の Archive では、プロジェクトの entitlements のファイル（CODE_SIGN_ENTITLEMENTS）がアプリに入らない。
        # Export は Archive の中のアプリを再署名するだけなので、そのままだと配信ビルドには基本の entitlement
        # （application-identifier など）しか付かず、WeatherKit などが実機で動かない。
        # entitlements のファイルでアプリをアドホック署名しておく（本番の署名は Export がする）。
        # ファイルの中の $(AppIdentifierPrefix) のような変数は、ここでは展開されない。残ったまま書き出されたら、書き出したあとの確認で落ちる。
        # 対象はアプリ本体だけ（App Extension の entitlements は入れない）
        run: |
          # ビルド設定を読めなかったら、ここで止める（パイプにつなぐと失敗が隠れて「ファイルなし」の扱いになり、確認の手順も飛ばされる）
          if ! settings=$(xcodebuild -showBuildSettings \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release 2> "$RUNNER_TEMP/show-build-settings.log"); then
            cat "$RUNNER_TEMP/show-build-settings.log"
            echo "::error::ビルド設定（CODE_SIGN_ENTITLEMENTS）を読めませんでした"
            exit 1
          fi
          entitlements=$(printf '%s\n' "$settings" | sed -n 's/^ *CODE_SIGN_ENTITLEMENTS = //p' | head -1)
          echo "ENTITLEMENTS_PATH=$entitlements" >> "$GITHUB_ENV"
          if [[ -z "$entitlements" ]]; then
            echo "entitlements のファイルはありません"
            exit 0
          fi
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$RUNNER_TEMP/build.xcarchive/Info.plist")
          app="$RUNNER_TEMP/build.xcarchive/Products/$app_path"
          codesign --force --sign - --entitlements "$entitlements" "$app"
          echo "アプリに入れた entitlements (${entitlements}):"
          codesign -d --entitlements - --xml "$app" | plutil -p -

      - name: Create ExportOptions.plist and API private key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$EXPORT_OPTIONS" > "$EXPORT_OPTIONS_PATH"
          plutil -lint "$EXPORT_OPTIONS_PATH"
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string export "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Verify entitlements of the exported IPA
        # entitlements のファイルに書いた項目が、書き出した IPA のアプリにも入っているかを確かめる。
        # 欠けたまま配信すると、ビルドもアップロードも成功するのに、実機でその機能だけ動かない。
        # 比べるのは項目の有無だけ（aps-environment のように、Export が値を配信用に書き換える項目があるため）。
        # 値は、展開されていない変数 $(…) が残っていないかだけを見る
        run: |
          if [[ -z "$ENTITLEMENTS_PATH" ]]; then
            echo "entitlements のファイルはありません"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa-check"
          app=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/ipa-check/exported.plist"
          echo "書き出した IPA の entitlements:"
          plutil -p "$RUNNER_TEMP/ipa-check/exported.plist"
          python3 - "$ENTITLEMENTS_PATH" "$RUNNER_TEMP/ipa-check/exported.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as file:
              wanted = plistlib.load(file)
          with open(sys.argv[2], "rb") as file:
              exported = plistlib.load(file)
          missing = [key for key in wanted if key not in exported]
          if missing:
              print("::error::書き出した IPA に入っていない entitlement: " + ", ".join(missing))
              sys.exit(1)
          unexpanded = [key for key, value in exported.items() if "$(" in repr(value)]
          if unexpanded:
              print("::error::書き出した IPA の entitlement に、展開されていない変数 $(…) が残っています: " + ", ".join(unexpanded))
              sys.exit(1)
          print("entitlements のファイルの項目は、すべて入っています: " + ", ".join(wanted))
          PY

      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Check app exists in App Store Connect
        # App Store Connect にアプリが無いと、アップロードが "Error Downloading App Information" で失敗し原因が分かりにくい。
        # アプリの作成は API でできないため、ここでは読み取りだけで確認し、無ければ作成手順を Job Summary に出して止める。
        # Bundle ID は直前の Export で Developer Portal に登録済みなので、この時点で Web 画面から選べる
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
          APP_NAME="$PROJECT_NAME" \
            ruby .github/scripts/check-app-store-app.rb

      - name: Set up TestFlight internal testers
        # 内部テストグループ（すべてのビルドを自動配信）を用意し、Secret TESTFLIGHT_INTERNAL_TESTERS のメールアドレスを内部テスターに入れる。
        # アップロードより前に済ませておくと、このあとのビルドも処理が終わりしだい配信される。2 回目以降は確認だけで何もしない。
        # テスターの設定に失敗してもアップロードは止めない（Job Summary と注釈で知らせる）。
        # メールアドレスは変数から渡さない。ステップの env の表示で、変数の値はそのまま、Secret の値は *** でログに出る（public リポジトリのログは誰でも見られる）。
        # 以前の変数 TESTFLIGHT_INTERNAL_TESTERS は値を読まず、残っているかだけを見て Secret に移すよう知らせる
        if: ${{ inputs.upload }}
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TESTERS: ${{ secrets.TESTFLIGHT_INTERNAL_TESTERS }}
          TESTERS_VARIABLE_SET: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS != '' }}
        run: |
          if [ -z "$TESTERS" ] && [ "$TESTERS_VARIABLE_SET" = true ]; then
            echo "::warning::変数 TESTFLIGHT_INTERNAL_TESTERS は読みません（変数の値はログに出るため）。値を同じ名前の Secret に移してください（README の「TestFlight の内部テスター」）"
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
            ruby .github/scripts/ensure-internal-testers.rb

      - name: Upload to App Store Connect
        # ビルド番号は Xcode に採番させる（manageAppVersionAndBuildNumber）。App Store Connect 上の最新ビルド番号を見て
        # 自動で増やすので、xcconfig の CURRENT_PROJECT_VERSION を手で上げる必要はない。
        # org 共有の EXPORT_OPTIONS Secret は他リポジトリでも使うため書き換えず、ランナー上のコピーだけを上書きする
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string upload "$EXPORT_OPTIONS_PATH"
          plutil -replace manageAppVersionAndBuildNumber -bool YES "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

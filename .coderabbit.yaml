# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定: https://docs.coderabbit.ai/reference/configuration
language: ja-JP

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # デフォルトブランチ (develop) 以外に向けた PR もレビューする。
    # ralph-loop の子 PR（epic/** 宛て）は対象に入れない。レート制限が PR の作者単位で、
    # 全リポジトリのループが 1 つの枠を取り合うため。子 PR は第三者としてのセルフレビューで確かめ、
    # CodeRabbit は epic → develop の最終 PR でレビューする（ralph-kit の README.md）。
    base_branches:
      - "release/.*"
      - "main"
  path_filters:
    # 自動生成・バイナリ系はレビュー対象外
    - "!**/*.xcassets/**"
    - "!**/Package.resolved"
    # pbxproj はレビュー対象に残す。ループには触らせない方針なので、意図しない変更が入ったら気づけるようにする
    - "!DerivedData/**"
  tools:
    swiftlint:
      enabled: true
      config_file: ".swiftlint.yml"

chat:
  auto_reply: true
